name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Build for iPhone without signing
        run: |
          set -euo pipefail
          xcodebuild -project StudyLibrary.xcodeproj -scheme StudyLibrary \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/StudyLibraryBuild" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package and check the IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/StudyLibraryBuild/Build/Products/Release-iphoneos/StudyLibrary.app"
          output="$RUNNER_TEMP/StudyLibraryIPA"
          mkdir -p "$output/Payload"
          test -f "$app/Info.plist"
          test -x "$app/StudyLibrary"
          test ! -e "$app/_CodeSignature"
          test ! -e "$app/embedded.mobileprovision"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist"
          lipo "$app/StudyLibrary" -verify_arch arm64
          ditto "$app" "$output/Payload/StudyLibrary.app"
          cd "$output"
          executable="Payload/StudyLibrary.app/StudyLibrary"
          if codesign --display "$executable" >/dev/null 2>&1; then
            codesign --remove-signature "$executable"
          fi
          /usr/bin/zip -qry StudyLibrary-unsigned.ipa Payload
          /usr/bin/unzip -tq StudyLibrary-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: StudyLibrary-unsigned
          path: ${{ runner.temp }}/StudyLibraryIPA/StudyLibrary-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
